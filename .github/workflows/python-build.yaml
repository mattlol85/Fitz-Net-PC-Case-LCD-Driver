name: Python Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: 🧪 Build & Test
    runs-on: windows-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: pip install -e ".[dev]"

      - name: ✅ Lint
        run: ruff check .

      - name: 🧪 Run tests
        run: pytest -q

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fitzlcd"
version = "1.2.0"
description = "Desktop driver for PC-case USB LCD panels (Jonsbo DS916 and friends)"
requires-python = ">=3.12"
dependencies = [
    "pyserial>=3.5",
    "pillow>=11.0",
    "numpy>=2.0",
    "PySide6>=6.8",
    "psutil>=6.0",
    "nvidia-ml-py>=12.560",
    "av>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "black>=24.0",
    "pyinstaller>=6.10",
]

[project.scripts]
fitzlcd = "fitzlcd.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
